apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-ssms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-ssms
  template:
    metadata:
      labels:
        app: mobile-ssms
    spec:
      containers:
        - name: server
          image: mobile-ssms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_PORT
              value: "3000"
            - name: DB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: mssql-config
                  key: DB_SERVER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mssql-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mssql-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-credentials
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-ssms
spec:
  type: ClusterIP
  selector:
    app: mobile-ssms
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mssql-config
data:
  DB_SERVER: "tvsdb1.thanvasupos.com"
  DB_PORT: "28914"
---
apiVersion: v1
kind: Secret
metadata:
  name: mssql-credentials
type: Opaque
stringData:
  DB_USER: ""
  DB_PASSWORD: ""
