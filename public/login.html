<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f7f7; }
      .card { max-width: 380px; margin: 10vh auto; }
    </style>
  </head>
  <body>
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <strong>SQL WebService Login</strong>
      </div>
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">User ID</label>
            <input class="form-control" id="userId" value="admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" id="password" type="password" value="1234">
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <div id="msg" class="text-danger small mt-2"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('userId').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, password })
        });
        const out = await res.json();
        if (res.ok && out.token) {
          localStorage.setItem('auth_token', out.token);
          location.href = '/';
        } else {
          document.getElementById('msg').innerText = out.error || 'Login failed';
        }
      });
    </script>
  </body>
</html>
